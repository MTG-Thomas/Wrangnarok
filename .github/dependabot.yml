# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    ignore:
      # Hold vitest at 4.x: @cloudflare/vitest-plugin@1.1.6 peers
      # vitest ^4.1.0, so vitest 5 breaks `npm ci` with ERESOLVE
      # (see PR23, superseded for now by PR25). Revisit once Cloudflare
      # ships a vitest-5-compatible plugin.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # Hold typescript at 5.x: typescript-eslint@8.70.0 hard-fails on
      # TS 7 ("typescript-eslint does not support TS 7.0"), so TS 7
      # breaks `npm run lint` and the CI Lint gate (see PR32, closed;
      # tsc itself and the test suite pass on TS 7.0.2). Revisit once
      # typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
