name: Canonicalize AGPL license

on:
  push:
    paths:
      - .github/workflows/canonical-license.yml

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch canonical AGPL-3.0 text
        run: |
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/licenses/agpl-3.0 \
            | jq -r '.body' > LICENSE
          grep -q 'END OF TERMS AND CONDITIONS' LICENSE
          grep -q 'Remote Network Interaction' LICENSE
      - name: Commit canonical license and remove bootstrap workflow
        run: |
          rm .github/workflows/canonical-license.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LICENSE .github/workflows/canonical-license.yml
          git commit -m 'chore: install canonical AGPL-3.0 license text'
          git push
